name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm check:audit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Lint, format, and typecheck
        run: pnpm exec prek run --all-files

  # Fork note (WILSCH-AI-SERVICES): the upstream gated release on a `live-smoke` job that
  # needs a GitHub environment and secrets this fork does not carry; parity against the
  # house's instance is `twenty parity check`, run from the host, not from CI.
  build-release:
    needs: [verify]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            targets: linux-x64,linux-arm64
            artifact_name: release-linux
          - runner: macos-14
            platform: darwin
            arch: arm64
            targets: macos-arm64,macos-x64
            artifact_name: release-macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rosetta for cross-packaging
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Build release archives
        run: pnpm release:build -- --version "${GITHUB_REF_NAME#v}" --targets "${{ matrix.targets }}"

      - name: Smoke native release archive
        run: node scripts/smoke-release-artifact.mjs --release-dir dist/release --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/release/twenty_*.tar.gz

  release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true

      - name: Write release metadata
        run: pnpm release:metadata -- --tag "${GITHUB_REF_NAME}" --output-dir dist/release

      - name: Build npm package
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm build

      - name: Set npm package version
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm --filter ./packages/twenty-sdk exec npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Configure npm auth
        if: ${{ env.NPM_TOKEN != '' }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"

      - name: Publish npm package
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm --filter ./packages/twenty-sdk publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/release/twenty_*.tar.gz \
              dist/release/checksums.txt \
              dist/release/release-metadata.json \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/release/twenty_*.tar.gz \
              dist/release/checksums.txt \
              dist/release/release-metadata.json \
              --generate-notes
          fi

      # Fork note (WILSCH-AI-SERVICES): the upstream's Homebrew-tap dispatch is removed;
      # the house has no tap. Release assets on this repository are the distribution.
