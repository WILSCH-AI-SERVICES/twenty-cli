name: Live Smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      base_url:
        description: Base URL for the live environment
        required: true
        type: string
      workspace:
        description: Workspace profile for the live environment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: live-smoke
    env:
      TWENTY_API_TOKEN: ${{ secrets.TWENTY_LIVE_TOKEN }}
      TWENTY_BASE_URL: ${{ inputs.base_url || vars.TWENTY_LIVE_BASE_URL }}
      TWENTY_PROFILE: ${{ inputs.workspace || vars.TWENTY_LIVE_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live smoke tests
        run: pnpm test:smoke:live
